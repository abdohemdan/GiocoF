<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Editor di tracciati - Crea la tua mappa">
  <defs>
    <linearGradient id="trackGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- griglia stile editor -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="1">
    <line x1="0"   y1="50"  x2="400" y2="50"/>
    <line x1="0"   y1="100" x2="400" y2="100"/>
    <line x1="0"   y1="150" x2="400" y2="150"/>
    <line x1="0"   y1="200" x2="400" y2="200"/>
    <line x1="0"   y1="250" x2="400" y2="250"/>
    <line x1="0"   y1="300" x2="400" y2="300"/>
    <line x1="0"   y1="350" x2="400" y2="350"/>
    <line x1="50"  y1="0"   x2="50"  y2="400"/>
    <line x1="100" y1="0"   x2="100" y2="400"/>
    <line x1="150" y1="0"   x2="150" y2="400"/>
    <line x1="200" y1="0"   x2="200" y2="400"/>
    <line x1="250" y1="0"   x2="250" y2="400"/>
    <line x1="300" y1="0"   x2="300" y2="400"/>
    <line x1="350" y1="0"   x2="350" y2="400"/>
  </g>

  <!-- tracciato: asfalto -->
  <path d="M120,300 C40,260 60,150 150,150 C220,150 200,80 280,90 C350,98 360,200 300,230 C250,255 280,320 200,330 C170,334 150,318 120,300 Z"
        fill="none" stroke="#1b2740" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85"/>

  <!-- bordo neon del tracciato -->
  <path d="M120,300 C40,260 60,150 150,150 C220,150 200,80 280,90 C350,98 360,200 300,230 C250,255 280,320 200,330 C170,334 150,318 120,300 Z"
        fill="none" stroke="url(#trackGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- linea centrale tratteggiata -->
  <path d="M120,300 C40,260 60,150 150,150 C220,150 200,80 280,90 C350,98 360,200 300,230 C250,255 280,320 200,330 C170,334 150,318 120,300 Z"
        fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="2 16" stroke-opacity="0.8" stroke-linecap="round"/>

  <!-- linea di partenza a scacchi -->
  <g transform="translate(150,150) rotate(60)">
    <rect x="-20" y="-19" width="40" height="38" fill="#0b1020" opacity="0.6"/>
    <g fill="#ffffff">
      <rect x="-20" y="-19" width="10" height="9.5"/>
      <rect x="0"   y="-19" width="10" height="9.5"/>
      <rect x="-10" y="-9.5" width="10" height="9.5"/>
      <rect x="10"  y="-9.5" width="10" height="9.5"/>
      <rect x="-20" y="0"   width="10" height="9.5"/>
      <rect x="0"   y="0"   width="10" height="9.5"/>
      <rect x="-10" y="9.5" width="10" height="9.5"/>
      <rect x="10"  y="9.5" width="10" height="9.5"/>
    </g>
  </g>

  <!-- nodi di modifica (handle dell'editor) -->
  <g>
    <circle cx="150" cy="150" r="8" fill="#0b1020" stroke="#ffcc00" stroke-width="3"/>
    <circle cx="280" cy="90"  r="8" fill="#0b1020" stroke="#ffcc00" stroke-width="3"/>
    <circle cx="300" cy="230" r="8" fill="#0b1020" stroke="#ffcc00" stroke-width="3"/>
    <circle cx="200" cy="330" r="8" fill="#0b1020" stroke="#ffcc00" stroke-width="3"/>
    <circle cx="120" cy="300" r="8" fill="#0b1020" stroke="#ffcc00" stroke-width="3"/>
  </g>

  <!-- matita / cursore di disegno -->
  <g transform="translate(286,250) rotate(35)" filter="url(#glow)">
    <rect x="-9" y="-58" width="18" height="64" rx="3" fill="#ffcc00"/>
    <rect x="-9" y="-58" width="18" height="12" rx="3" fill="#ffffff" opacity="0.8"/>
    <polygon points="-9,6 9,6 0,28" fill="#ffe89a"/>
    <polygon points="-3,18 3,18 0,28" fill="#1b2740"/>
  </g>
</svg>
